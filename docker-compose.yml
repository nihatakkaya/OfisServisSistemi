services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ofisservis_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "(/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: always

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ofisservis_web
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=OfisServisSistemiDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true;
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - SuperAdminKullaniciAdi=${SUPER_ADMIN_KULLANICI_ADI}
      - SchoolApi__LoginUrl=${SCHOOL_API_LOGIN_URL}
      - SchoolApi__SearchUserUrl=${SCHOOL_API_SEARCH_USER_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  sql_data:
